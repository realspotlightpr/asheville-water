<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Free Consultation - Website</title>
  <style>
    html, body { margin: 0; padding: 0; background: white; }
    #consultation-widget { display: flow-root; }
    #consultation-widget iframe { display: block; }
  </style>
</head>
<body>
  <main id="consultation-widget">
    <iframe
      src="https://api.leadconnectorhq.com/widget/form/2UXJNBw1z7leQKagbhm1"
      style="width:100%;height:834px;border:none;border-radius:8px"
      id="inline-2UXJNBw1z7leQKagbhm1-home"
      data-layout='{"id":"INLINE"}'
      data-trigger-type="alwaysShow"
      data-trigger-value=""
      data-activation-type="alwaysActivated"
      data-activation-value=""
      data-deactivation-type="neverDeactivate"
      data-deactivation-value=""
      data-form-name="Free Consultation - Website"
      data-height="834"
      data-layout-iframe-id="inline-2UXJNBw1z7leQKagbhm1-home"
      data-form-id="2UXJNBw1z7leQKagbhm1"
      data-cookie-consent="true"
      data-cookie-consent-provider="auto"
      title="Free Consultation - Website"
      scrolling="no"
    ></iframe>
  </main>
  <script>
    // The vendor uses this document's URL for the source of an inline form.
    // Mirror only known campaign parameters and only from our own homepage.
    if (window.parent !== window) {
      try {
        const parentUrl = new URL(window.parent.location.href);
        if (parentUrl.origin === location.origin && parentUrl.pathname === "/") {
          const params = new URLSearchParams();
          for (const key of ["source", "utm_source", "utm_medium", "utm_campaign", "utm_term", "utm_content"]) {
            const value = parentUrl.searchParams.get(key);
            if (value) params.set(key, value.slice(0, 160));
          }
          const query = params.toString();
          history.replaceState(null, "", "/" + (query ? "?" + query : ""));
        }
      } catch {
        // An embedded copy on another origin cannot read its parent URL.
      }
    }
  </script>
  <script src="https://link.msgsndr.com/js/form_embed.js" async></script>
</body>
</html>
